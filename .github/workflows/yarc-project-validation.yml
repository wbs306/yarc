name: YARC Project Validation

on:
  push:
    branches:
      - openai/yarc-project

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @yarc/db generate
      - name: API typecheck
        run: pnpm --filter @yarc/api typecheck
      - name: Web build
        run: pnpm --filter @yarc/web build
      - name: API tests
        run: pnpm --filter @yarc/api test
