name: Apply Project UI alignment

on:
  push:
    branches:
      - openai/yarc-project
    paths:
      - .github/workflows/apply-project-ui-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/yarc-project
          fetch-depth: 0

      - name: Apply reviewed UI alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/pages/ProjectWorkspacePage.vue')
          text = p.read_text()

          def replace(old, new, count=1):
              global text
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'expected {count} occurrence(s), found {found}: {old!r}')
              text = text.replace(old, new, count)

          replace(
              "  ProjectGitCommit,\n  ProjectHistoryCheckpoint,",
              "  ProjectGitCommit,\n  ProjectGitFileStatus,\n  ProjectHistoryCheckpoint,",
          )

          replace(
              "const EDITABLE_NAMES = new Set(['.gitignore', '.gitattributes', 'Dockerfile', 'Makefile'])\n",
              "const EDITABLE_NAMES = new Set(['.gitignore', '.gitattributes', 'Dockerfile', 'Makefile'])\nconst DOCUMENT_GIT_EXTENSIONS = new Set(['tex', 'bib', 'sty', 'cls', 'bst'])\nconst CODE_GIT_EXTENSIONS = new Set(['py', 'r', 'jl', 'm', 'c', 'h', 'cc', 'cpp', 'hpp', 'ts', 'tsx', 'js', 'jsx', 'vue', 'sh', 'zsh', 'fish', 'sql'])\n",
          )

          replace(
              "const commitMessage = ref('')\n",
              "const commitMessage = ref('')\nconst selectedGitPaths = ref<string[]>([])\n",
          )

          replace(
              "const flatFiles = computed(() => flattenNodes(files.value))\n",
              "const flatFiles = computed(() => flattenNodes(files.value))\n\nconst gitCategory = (path: string) => {\n  const name = fileName(path)\n  const dot = name.lastIndexOf('.')\n  const ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : ''\n  if (DOCUMENT_GIT_EXTENSIONS.has(ext)) return 'Document' as const\n  if (CODE_GIT_EXTENSIONS.has(ext)) return 'Code' as const\n  return 'Other' as const\n}\nconst gitGroups = computed(() => {\n  const groups: Array<{ name: 'Code' | 'Document' | 'Other'; files: ProjectGitFileStatus[] }> = [\n    { name: 'Code', files: [] },\n    { name: 'Document', files: [] },\n    { name: 'Other', files: [] },\n  ]\n  for (const file of store.gitStatus?.files || []) groups.find(group => group.name === gitCategory(file.path))!.files.push(file)\n  return groups.filter(group => group.files.length)\n})\n",
          )

          replace(
              "  remotes.value = remoteData.remotes\n",
              "  remotes.value = remoteData.remotes\n  selectedGitPaths.value = selectedGitPaths.value.filter(path => status.files.some(file => file.path === path))\n",
          )

          replace(
              "async function stage(path: string) {\n",
              "async function stageSelected() {\n  const paths = [...selectedGitPaths.value]\n  if (!paths.length) return\n  try {\n    await json(`/api/projects/${projectId.value}/git/stage`, { method: 'POST', body: JSON.stringify({ paths }) })\n    selectedGitPaths.value = []\n    await loadGit()\n  } catch (err) { error.value = (err as Error).message }\n}\n\nasync function stage(path: string) {\n",
          )

          replace(
              "        <button @click=\"router.push('/')\">文献</button>\n        <button @click=\"startBuild\">Build</button>",
              "        <button @click=\"router.push('/')\">文献</button>\n        <button @click=\"router.push(`/projects/${projectId}/settings`)\">Settings</button>\n        <button @click=\"startBuild\">Build</button>",
          )

          replace(
              "          <div v-for=\"file in store.gitStatus?.files || []\" :key=\"file.path\" class=\"git-file\">\n            <button class=\"path\" @click=\"openFile(file.path)\">\n              {{ file.indexStatus }}{{ file.worktreeStatus }} {{ file.originalPath ? `${file.originalPath} → ${file.path}` : file.path }}\n            </button>\n            <div><button v-if=\"file.indexStatus===' ' || file.indexStatus==='?'\" @click=\"stage(file.path)\">Stage</button><button v-else @click=\"unstage(file.path)\">Unstage</button></div>\n          </div>",
              "          <div class=\"toolbar\"><button :disabled=\"!selectedGitPaths.length\" @click=\"stageSelected\">Stage selected ({{ selectedGitPaths.length }})</button></div>\n          <section v-for=\"group in gitGroups\" :key=\"group.name\" class=\"git-group\">\n            <h3>{{ group.name }}</h3>\n            <div v-for=\"file in group.files\" :key=\"file.path\" class=\"git-file\">\n              <label class=\"git-select\"><input v-model=\"selectedGitPaths\" type=\"checkbox\" :value=\"file.path\" :disabled=\"file.indexStatus!==' ' && file.indexStatus!=='?'\" /></label>\n              <button class=\"path\" @click=\"openFile(file.path)\">\n                {{ file.indexStatus }}{{ file.worktreeStatus }} {{ file.originalPath ? `${file.originalPath} → ${file.path}` : file.path }}\n              </button>\n              <div><button v-if=\"file.indexStatus===' ' || file.indexStatus==='?'\" @click=\"stage(file.path)\">Stage</button><button v-else @click=\"unstage(file.path)\">Unstage</button></div>\n            </div>\n          </section>",
          )

          replace(
              "          <button v-if=\"currentLive?.dirty.value\" @click=\"flushFile\">Flush</button>\n",
              "          <button v-if=\"selectedPath && selectedEditable\" @click=\"sideTab='history'\">History</button>\n          <button v-if=\"currentLive?.dirty.value\" @click=\"flushFile\">Flush</button>\n",
          )

          replace(
              ".git-file{display:flex;gap:4px;justify-content:space-between;align-items:center}.git-file .path",
              ".git-group{display:grid;gap:4px}.git-file{display:flex;gap:4px;justify-content:space-between;align-items:center}.git-select{display:flex!important;align-items:center;opacity:1!important}.git-select input{margin:0}.git-file .path",
          )

          p.write_text(text)
          Path('.github/workflows/apply-project-ui-alignment.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit UI alignment
        run: |
          git config user.name "Wbscript"
          git config user.email "wbs306@gmail.com"
          git add -A
          git commit -m "feat: align Project Git and History workspace UI"
          git push origin HEAD:openai/yarc-project
