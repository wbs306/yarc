name: Project validation

# Branch-only validation for the Project implementation before manual merge.
on:
  push:
    branches:
      - openai/yarc-project
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yarc/db generate

      - name: API typecheck
        run: pnpm --filter @yarc/api typecheck

      - name: Web build
        run: pnpm --filter @yarc/web build

      - name: API tests by file
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          for test_file in src/services/*.test.ts src/lib/pi-runtime/*.test.ts; do
            echo "::group::$test_file"
            timeout 120s pnpm exec tsx --test "$test_file"
            echo "::endgroup::"
          done
