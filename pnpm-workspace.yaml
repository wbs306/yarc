packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.80.2'
  - '@earendil-works/pi-ai@0.80.2'
  - '@earendil-works/pi-coding-agent@0.80.2'
  - '@earendil-works/pi-tui@0.80.2'

publicHoistPattern:
  - '@embedpdf/*'
